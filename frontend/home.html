<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-800">

    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
        <div class="p-6 border-b border-gray-100">
            <h2 class="text-xl font-bold">Menu</h2>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="commits.html" class="block px-4 py-2 rounded hover:bg-gray-100 transition">Commits</a>
            <a href="squads.html" class="block px-4 py-2 rounded hover:bg-gray-100 transition">Progresso das Squads</a>
            <a href="history.html" class="block px-4 py-2 rounded hover:bg-gray-100 transition">Histórico</a>
            <a href="badges.html" class="block px-4 py-2 rounded hover:bg-gray-100 transition">Badges</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col relative">
        
        <header class="bg-white border-b border-gray-200 p-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800" id="team-name">Carregando Equipe...</h1>
            <div>
              <a href="login.html" class="text-sm hover:underline" referrerpolicy="">Entrar</a>
              <a href="" class="text-sm hover:underline ml-4">Sair</a>
            </div>
        </header>

        <div class="p-6 flex-1 overflow-y-auto">
            <h2 class="text-lg font-semibold mb-6">Quadro de Tarefas</h2>
            
            <div id="tasks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded shadow-sm border border-gray-250 border-l-4 border-l-purple-500">
                    <p class="text-sm text-gray-500">Dados</p>
                </div>
            </div>
        </div>

        <button id="btn-add-task" class="absolute bottom-8 right-8 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg hover:bg-blue-700 transition flex items-center justify-center text-3xl pb-1" title="Adicionar Tarefa">
            +
        </button>

        <!-- modal -->

        <dialog id="add-task" class="fixed">
          <h2> Adicionar tarefa</h2>
          <form>

          </form>
        </dialog>
    </main>

</body>
</html>
