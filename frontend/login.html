<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <main class="bg-white p-8 rounded shadow-sm border border-gray-200 w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Acessar Plataforma</h1>
        
        <form id="api-login-form" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
            </div>

            <button type="submit" class="w-full bg-gray-800 text-white font-medium py-2 px-4 rounded hover:bg-gray-900 transition">
                Entrar
            </button>
        </form>
        
        <div id="login-alert" class="mt-4 p-3 bg-red-50 text-red-600 text-sm rounded hidden text-center">
            Credenciais inválidas,  Tente novamente.
        </div>
    </main>

</body>
</html>
